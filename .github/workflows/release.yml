name: Release Module

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version $VERSION"
          echo "ZIP_NAME=mosh-journal-enhancer-v$VERSION.zip" >> $GITHUB_ENV
          echo "RELEASE_DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/v$VERSION/mosh-journal-enhancer-v$VERSION.zip" >> $GITHUB_ENV

      - name: Update module.json version and download URL
        run: |
          sed -i 's/#{VERSION}#/${{ steps.get_version.outputs.VERSION }}/g' module.json
          cat module.json

      - name: Create release archive
        run: |
          zip -r ${{ env.ZIP_NAME }} \
            module.json \
            README.md \
            CHANGELOG.md \
            LICENSE \
            lang/ \
            scripts/ \
            styles/ \
            templates/ \
            docs/ \
            -x "*.git*" \
            -x "*node_modules/*"

      - name: Build release notes from changelog
        run: |
          awk -v version="${{ steps.get_version.outputs.VERSION }}" '
            $0 ~ "^## \\[" version "\\]" { in_section=1; next }
            in_section && $0 ~ "^## \\[" { exit }
            in_section { print }
          ' CHANGELOG.md > CHANGELOG_SECTION.md

          if [ ! -s CHANGELOG_SECTION.md ]; then
            echo "No changelog section found for v${{ steps.get_version.outputs.VERSION }}." > CHANGELOG_SECTION.md
          fi

          {
            echo "## Changes"
            echo
            cat CHANGELOG_SECTION.md
            echo
            echo "## Installation"
            echo
            echo "**Manifest URL:** \`https://github.com/${{ github.repository }}/releases/download/v${{ steps.get_version.outputs.VERSION }}/module.json\`"
            echo
            echo "Or use the latest manifest: \`https://github.com/${{ github.repository }}/releases/latest/download/module.json\`"
          } > RELEASE_NOTES.md

      - name: Update Release with Files
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: v${{ steps.get_version.outputs.VERSION }}
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json, ./${{ env.ZIP_NAME }}'
          tag: v${{ steps.get_version.outputs.VERSION }}
          generateReleaseNotes: false
          bodyFile: RELEASE_NOTES.md
