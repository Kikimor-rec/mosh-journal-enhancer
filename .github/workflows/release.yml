name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build draft release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Validate manifest version
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          VERSION="$version" node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("module.json", "utf8"));
            if (manifest.version !== process.env.VERSION) {
              throw new Error(`module.json version ${manifest.version} does not match tag ${process.env.VERSION}`);
            }
            if (!manifest.download.includes(`/v${process.env.VERSION}/`)) {
              throw new Error(`module.json download URL does not point at v${process.env.VERSION}`);
            }
          '

      - name: Build artifacts
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp module.json dist/module.json
          zip -r "dist/mosh-journal-enhancer-v${version}.zip" \
            module.json README.md CHANGELOG.md LICENSE \
            scripts styles templates lang docs \
            -x "*.git*" \
            -x "*node_modules/*"

      - name: Generate release notes
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > CHANGELOG_SECTION.md

          if [ ! -s CHANGELOG_SECTION.md ]; then
            echo "No CHANGELOG.md section found for ${version}" >&2
            exit 1
          fi

          {
            echo "## Changes"
            cat CHANGELOG_SECTION.md
            echo
            echo "## Installation"
            echo "- Manifest: https://github.com/Kikimor-rec/mosh-journal-enhancer/releases/latest/download/module.json"
            echo "- Download: https://github.com/Kikimor-rec/mosh-journal-enhancer/releases/download/v${version}/mosh-journal-enhancer-v${version}.zip"
          } > RELEASE_NOTES.md

      - name: Create draft release
        uses: ncipollo/release-action@v1
        with:
          name: "MOSH Journal Enhancer v${{ steps.version.outputs.version }}"
          draft: true
          prerelease: false
          allowUpdates: true
          bodyFile: RELEASE_NOTES.md
          artifacts: "dist/module.json,dist/mosh-journal-enhancer-v${{ steps.version.outputs.version }}.zip"
